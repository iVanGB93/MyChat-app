plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.axonicnearby'
version = ''

dependencies {
  implementation 'org.bouncycastle:bcprov-jdk18on:1.86'
  testImplementation 'junit:junit:4.13.2'
}

android {
  namespace "expo.modules.axonicnearby"
  defaultConfig {
    versionCode 1
    versionName ""
  }
  lintOptions {
    abortOnError false
  }
}
